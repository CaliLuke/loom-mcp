CONSTANTS Roots = {r1, r2, r3}
          Children = {}
          MaxMsgs = 1
          Fault = "non_idempotent_publish"
SPECIFICATION Spec
INVARIANT NoFalseSupersede
INVARIANT PublishedImpliesSealed
INVARIANT OneSuccessor
INVARIANT PositionsFollowChain
INVARIANT ChildNeverPublishes
INVARIANT OrderIsChronological
INVARIANT CitationsResolve
INVARIANT NoSilentBodyMismatch
