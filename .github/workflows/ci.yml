name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.26.1'
  LOOM_VERSION: 'v1.4.0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install protoc (for make tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install developer tools
        run: |
          make tools

      - name: Install Loom CLI
        run: |
          go install github.com/CaliLuke/loom/cmd/loom@${LOOM_VERSION}
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Verify build
        run: make build

      - name: Lint
        run: make lint

      - name: Run unit tests
        env:
          LOOM_MCP_REQUIRE_DOCKER_TESTS: '1'
        run: make test

      - name: Preserve coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ github.sha }}
          path: cover.out
          if-no-files-found: warn
          retention-days: 14

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            integration_tests/fixtures/assistant/go.sum
            integration_tests/fixtures/agent_features/go.sum

      - name: Install latest protoc
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip jq
          PROTOC_VERSION=$(curl -s https://api.github.com/repos/protocolbuffers/protobuf/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) ARCH=x86_64 ;;
            aarch64|arm64) ARCH=aarch_64 ;;
            *) echo "Unsupported arch: $ARCH" ; exit 1 ;;
          esac
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          FNAME="protoc-${PROTOC_VERSION}-${OS}-${ARCH}.zip"
          URL="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${FNAME}"
          echo "Downloading $URL" 
          curl -sSL -o /tmp/protoc.zip "$URL"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          /usr/local/bin/protoc --version

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Install Loom CLI
        run: |
          go install github.com/CaliLuke/loom/cmd/loom@${LOOM_VERSION}
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run integration tests
        run: make itest
