name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.27.0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            integration_tests/fixtures/assistant/go.sum
            integration_tests/fixtures/agent_features/go.sum

      - name: Install pinned protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          make install-protoc PROTOC_INSTALL_DIR="${RUNNER_TEMP}/protoc"
          echo "${RUNNER_TEMP}/protoc/bin" >> "${GITHUB_PATH}"

      - name: Install pinned developer tools
        run: make tools

      - name: Install canonical Loom CLI
        run: |
          LOOM_VERSION="$(bash ./scripts/loom_core_mode.sh remote-version)"
          go install github.com/CaliLuke/loom/cmd/loom@"${LOOM_VERSION}"
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Run complete CI contract
        env:
          VERIFY_GENERATED_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make ci

      - name: Preserve coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-${{ github.sha }}
          path: |
            cover.out
            docker-cover.out
          if-no-files-found: warn
          retention-days: 14
